<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Detail | Eco-Kart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="product">
  <div class="site-shell">
    <nav class="topbar slim">
      <a class="brand" href="index.html">
        <span class="brand-mark">E</span>
        <span>Eco-Kart</span>
      </a>
      <div class="topbar-actions">
        <a class="ghost-button" href="index.html">Back to Shop</a>
        <button class="pill-button" id="cartButton" type="button">Cart <span id="cartCount">0</span></button>
      </div>
    </nav>

    <main class="detail-layout" id="productDetail"></main>
  </div>

  <aside class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">Your Plant Cart</p>
        <h3>Checkout</h3>
      </div>
      <button class="icon-button" id="closeCartButton" type="button" aria-label="Close cart">X</button>
    </div>
    <div class="drawer-body">
      <div id="cartItems" class="stack-block"></div>
      <div class="checkout-card">
        <div class="total-row">
          <span>Total</span>
          <strong id="cartTotal">Rs 0</strong>
        </div>
        <form id="checkoutForm" class="stack-form">
          <input type="text" id="checkoutName" placeholder="Full Name" required>
          <input type="email" id="checkoutEmail" placeholder="Email Address" required>
          <input type="text" id="checkoutAddress" placeholder="Delivery Address" required>
          <button class="pill-button wide" type="submit">Place Order</button>
        </form>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
