<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | ApnaKart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="product">
  <header class="header small-header">
    <div class="container nav">
      <h1 class="logo">ApnaKart</h1>
      <div class="nav-buttons">
        <a href="index.html" class="btn light">Back</a>
        <button id="cartBtn" class="btn">Cart (<span id="cartCount">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="productDetail" class="detail-box"></div>
  </main>

  <div id="cartPanel" class="panel hidden">
    <div class="panel-head">
      <h3>Your Cart</h3>
      <button id="closeCartBtn" class="btn light">Close</button>
    </div>
    <div id="cartItems"></div>
    <h4>Total: <span id="cartTotal">Rs 0</span></h4>
    <form id="checkoutForm" class="form">
      <input type="text" id="checkoutName" placeholder="Full Name" required>
      <input type="email" id="checkoutEmail" placeholder="Email Address" required>
      <input type="text" id="checkoutAddress" placeholder="Delivery Address" required>
      <button type="submit" class="btn">Place Order</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
