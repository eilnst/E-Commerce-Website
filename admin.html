<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Eco-Kart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin">
  <div class="site-shell">
    <nav class="topbar slim">
      <a class="brand" href="index.html">
        <span class="brand-mark">E</span>
        <span>Eco-Kart</span>
      </a>
      <div class="topbar-actions">
        <a class="ghost-button" href="index.html">Storefront</a>
      </div>
    </nav>

    <main class="admin-layout">
      <section class="admin-hero">
        <div>
          <p class="eyebrow">Admin Panel</p>
          <h1>Plant store dashboard</h1>
          <p>Check plant categories, customer accounts, and recent plant orders from the Eco-Kart storefront.</p>
        </div>
        <button class="pill-button" id="resetOrdersButton" type="button">Clear Orders</button>
      </section>

      <section class="admin-grid">
        <article class="admin-card">
          <h2>Catalog Summary</h2>
          <div id="adminCatalog"></div>
        </article>
        <article class="admin-card">
          <h2>Registered Users</h2>
          <div id="adminUsers"></div>
        </article>
      </section>

      <section class="admin-card">
        <h2>Recent Orders</h2>
        <div id="adminOrders"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
